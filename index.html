<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b2b"><link rel="manifest" href="./manifest.webmanifest"><title>Kalima — Arabic Vocabulary</title>
<style>
:root{--bg:#f4f7f4;--panel:#fff;--ink:#172b2a;--muted:#71817d;--accent:#167c69;--soft:#e5f2ed;--line:#e4ebe7;--gold:#d8a84e;--shadow:0 8px 28px #163c3010}
[data-theme=dark]{--bg:#101b1a;--panel:#1b2927;--ink:#edf5f1;--muted:#a5b6af;--accent:#69c6a8;--soft:#263d36;--line:#31413c;--gold:#edc46d;--shadow:0 8px 28px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#102b2b;color:#fff;padding:22px 18px 25px;border-radius:0 0 25px 25px}
.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800;letter-spacing:.3px}.brand span{color:#8bd1b4}.tag{color:#c1d8cf;font-size:12px;margin-top:3px}
.iconbtn{border:1px solid #ffffff30;background:#ffffff12;color:white;border-radius:12px;padding:9px 12px;font-size:18px}
main{max-width:760px;margin:auto;padding:17px 15px 100px}.greeting{margin:4px 2px 15px}.greeting h2{font-size:20px;margin:0 0 4px}.greeting p{margin:0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 11px;box-shadow:var(--shadow)}.stat b{font-size:23px;display:block}.stat small{font-size:11px;color:var(--muted)}
.progressbox,.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:17px;box-shadow:var(--shadow);margin-bottom:13px}.progressrow{display:flex;justify-content:space-between;font-size:13px;font-weight:650}.track{height:8px;background:var(--soft);border-radius:10px;margin-top:11px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:10px;transition:.3s}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.action{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--shadow)}.action .emoji{font-size:22px;display:block;margin-bottom:8px}.action b{display:block}.action small{color:var(--muted);font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:var(--muted);font:11px system-ui;padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button span{font-size:20px}nav button.active{color:var(--accent);font-weight:800}
h2{font-size:19px;margin:3px 0 14px}.muted{color:var(--muted)}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;border-radius:12px;font:inherit;outline:none}textarea{min-height:70px;resize:vertical}.arabic{font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif;font-size:28px;line-height:1.8;direction:rtl;text-align:right}
.btn{border:0;border-radius:12px;background:var(--accent);color:white;padding:12px 15px;font-weight:750;font:inherit}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.danger{background:#b84c4c}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1}
.word{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.word:last-child{border:0}.wordmain{flex:1;min-width:0}.wordmain .arabic{font-size:25px}.wordmain small{color:var(--muted)}.star{border:0;background:none;font-size:22px;color:var(--gold);padding:6px}
.pill{font-size:11px;background:var(--soft);color:var(--accent);padding:4px 8px;border-radius:20px}
.bigword{text-align:center;padding:22px 5px}.bigword .arabic{font-size:42px;text-align:center}.translation{font-size:22px;text-align:center;font-weight:750;margin:12px}
.answer{display:block;width:100%;text-align:left;margin:8px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:13px;border-radius:12px;font:inherit}.answer.good{border-color:#25966f;background:#dff4e9;color:#145b43}.answer.bad{border-color:#c65b5b;background:#f9e5e5;color:#873838}
.empty{text-align:center;padding:30px 15px;color:var(--muted)}.hidden{display:none!important}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.search{margin-bottom:12px}
@media(min-width:600px){.actions{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">Kalima <span>كَلِمَة</span></div><div class="tag">Arabcha so‘zlarni o‘rganish</div></div><button class="iconbtn" id="themeBtn" aria-label="Tema">☾</button></div></header>
<main id="app"></main>
<nav>
<button data-tab="home" class="active"><span>⌂</span>Bosh sahifa</button>
<button data-tab="dict"><span>📚</span>Lug‘at</button>
<button data-tab="add"><span>＋</span>Qo‘shish</button>
<button data-tab="learn"><span>🎓</span>O‘rganish</button>
<button data-tab="games"><span>🎮</span>O‘yinlar</button>
</nav>
<script>
const KEY='kalima_words_v1', META='kalima_meta_v1';
let words=JSON.parse(localStorage.getItem(KEY)||'[]'), meta=JSON.parse(localStorage.getItem(META)||'{"goal":10,"learned":0,"correct":0,"streak":0,"lastDay":"","best":0}'), tab='home', reveal=false, current=null, quiz=null, quizIndex=0, score=0, selectedCat='Barchasi';
const $=s=>document.querySelector(s), app=$('#app');
function save(){localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(META,JSON.stringify(meta));}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){return new Date().toISOString().slice(0,10)}
function categories(){return ['Oila','Taom','Ish','Sayohat','Kundalik hayot','Ta’lim','Tabiat','Din','Boshqa']}
function switchTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('#themeBtn').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';localStorage.setItem('kalima_theme',document.documentElement.dataset.theme);};
if(localStorage.getItem('kalima_theme')==='dark')document.documentElement.dataset.theme='dark';
function stats(){let learned=words.filter(w=>w.level>=3).length,due=words.filter(w=>!w.next||w.next<=Date.now()).length;return {learned,due}}
function render(){
 if(tab==='home')home(); if(tab==='add')addForm(); if(tab==='dict')dictionary(); if(tab==='learn')learn(); if(tab==='games')games();
}
function home(){let s=stats(),pct=words.length?Math.round(s.learned/words.length*100):0;app.innerHTML=`
<div class="greeting"><h2>Assalomu alaykum! 👋</h2><p>Bugun yangi so‘zlarni o‘rganishga tayyormisiz?</p></div>
<div class="stats"><div class="stat"><b>${words.length}</b><small>Jami so‘zlar</small></div><div class="stat"><b>${s.learned}</b><small>O‘rganilgan</small></div><div class="stat"><b>${s.due}</b><small>Takrorlash</small></div></div>
<div class="progressbox"><div class="progressrow"><span>Kunlik maqsad</span><span>${Math.min(meta.learned,meta.goal)} / ${meta.goal}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,meta.learned/meta.goal*100)}%"></div></div><p class="muted" style="font-size:12px;margin:9px 0 0">Umumiy o‘zlashtirish: ${pct}% · Ketma-ket kunlar: ${meta.streak||0}</p></div>
<div class="actions">
<button class="action" onclick="switchTab('add')"><span class="emoji">✍️</span><b>So‘z qo‘shish</b><small>Yangi so‘z kiriting</small></button>
<button class="action" onclick="switchTab('dict')"><span class="emoji">📖</span><b>Mening lug‘atim</b><small>${words.length} ta so‘z</small></button>
<button class="action" onclick="switchTab('learn')"><span class="emoji">🧠</span><b>O‘rganish</b><small>So‘zlarni takrorlang</small></button>
<button class="action" onclick="switchTab('games')"><span class="emoji">🎯</span><b>Mini o‘yinlar</b><small>Bilimingizni sinang</small></button>
<button class="action" onclick="openOCR()"><span class="emoji">📷</span><b>Rasmdan matn</b><small>Arabcha yozuvni tanish</small></button>
<button class="action" onclick="exportWords()"><span class="emoji">💾</span><b>Zaxira nusxa</b><small>Lug‘atni saqlash</small></button></div>
<div class="card"><div class="sectionhead"><b>Bugungi tavsiya</b><span class="pill">Maslahat</span></div><p class="muted" style="margin:0">Har kuni oz-ozdan takrorlash yangi so‘zlarni uzoqroq eslab qolishga yordam beradi.</p></div>`}
function addForm(){app.innerHTML=`<h2>Yangi so‘z qo‘shish</h2><div class="card">
<div class="field"><label>Arabcha so‘z (harakatlar bilan)</label><input id="ar" class="arabic" dir="rtl" placeholder="مَدْرَسَةٌ"></div>
<div class="field"><label>O‘zbekcha tarjimasi</label><textarea id="uz" placeholder="maktab"></textarea></div>
<div class="field"><label>Talaffuzi (ixtiyoriy)</label><input id="tr" placeholder="madrasa"></div>
<div class="field"><label>Misol (ixtiyoriy)</label><textarea id="ex" placeholder="جُمْلَةٌ عَرَبِيَّةٌ"></textarea></div>
<div class="field"><label>Kategoriya</label><select id="cat">${categories().map(c=>`<option>${c}</option>`).join('')}</select></div>
<button class="btn" style="width:100%" onclick="addWord()">Saqlash</button><p class="muted" style="font-size:11px;margin-bottom:0">So‘zlar faqat shu qurilmaning brauzerida saqlanadi. Hozircha tarjimani o‘zingiz kiriting.</p></div>`}
function addWord(){let ar=$('#ar').value.trim(),uz=$('#uz').value.trim();if(!ar||!uz){alert('Arabcha so‘z va tarjimani kiriting.');return}if(words.some(w=>w.ar===ar)){alert('Bu so‘z lug‘atda bor.');return}words.unshift({id:Date.now(),ar,uz,tr:$('#tr').value.trim(),ex:$('#ex').value.trim(),cat:$('#cat').value,level:0,fav:false,added:Date.now(),next:0,seen:0});save();alert('So‘z saqlandi!');switchTab('dict')}
function dictionary(){app.innerHTML=`<div class="sectionhead"><h2>Mening lug‘atim</h2><span class="pill">${words.length} ta</span></div><input class="search" id="search" placeholder="🔎 So‘z qidirish..." oninput="filterWords()"><select id="filter" onchange="filterWords()" style="margin-bottom:12px"><option>Barchasi</option><option>⭐ Saralangan</option>${categories().map(c=>`<option>${c}</option>`).join('')}</select><div id="wordlist"></div>`;filterWords()}
function filterWords(){let q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'Barchasi';let arr=words.filter(w=>(w.ar+' '+w.uz+' '+w.tr).toLowerCase().includes(q)&&(f==='Barchasi'||(f==='⭐ Saralangan'?w.fav:w.cat===f)));$('#wordlist').innerHTML=arr.length?arr.map(w=>`<div class="word"><div class="wordmain"><div class="arabic">${esc(w.ar)}</div><b>${esc(w.uz)}</b><br><small>${esc(w.tr)} · ${esc(w.cat)}</small></div><button class="star" onclick="toggleFav(${w.id})">${w.fav?'★':'☆'}</button><button class="star" onclick="editWord(${w.id})">✎</button><button class="star" onclick="deleteWord(${w.id})">×</button></div>`).join(''):'<div class="empty">Hozircha so‘z topilmadi.<br>«Qo‘shish» orqali birinchi so‘zingizni kiriting.</div>'}
function toggleFav(id){let w=words.find(x=>x.id===id);w.fav=!w.fav;save();filterWords()}
function deleteWord(id){if(confirm('Bu so‘zni o‘chirasizmi?')){words=words.filter(w=>w.id!==id);save();filterWords()}}
function editWord(id){let w=words.find(x=>x.id===id),ar=prompt('Arabcha:',w.ar);if(ar===null)return;let uz=prompt('O‘zbekcha tarjima:',w.uz);if(uz===null)return;let tr=prompt('Talaffuz:',w.tr);if(tr===null)return;w.ar=ar.trim();w.uz=uz.trim();w.tr=tr.trim();save();filterWords()}
function learn(){if(!words.length){app.innerHTML='<div class="empty"><h2>Lug‘at bo‘sh</h2>Avval bir nechta so‘z qo‘shing.</div>';return}if(!current||!words.some(w=>w.id===current.id))current=words.find(w=>!w.next||w.next<=Date.now())||words[0];reveal=false;let w=current;app.innerHTML=`<h2>So‘zlarni o‘rganish</h2><div class="card"><div class="bigword"><div class="arabic">${esc(w.ar)}</div><div class="muted">${esc(w.tr)}</div>${reveal?`<div class="translation">${esc(w.uz)}</div>`:'<div class="muted" style="margin:16px">Tarjimani ko‘rish uchun bosing</div>'}</div>${w.ex?`<p class="muted" style="text-align:center">${esc(w.ex)}</p>`:''}<button class="btn secondary" style="width:100%" onclick="showTranslation()">${reveal?'Tarjima ko‘rsatildi':'Tarjimani ko‘rish'}</button><div class="btnrow" style="margin-top:12px"><button class="btn danger" onclick="rateWord(false)">Qayta o‘rganish</button><button class="btn" onclick="rateWord(true)">Bilaman ✓</button></div><p class="muted" style="text-align:center;font-size:12px">Daraja: ${w.level}/5 · Ko‘rilgan: ${w.seen} marta</p></div>`}
function showTranslation(){reveal=true;let w=current;app.querySelector('.bigword').innerHTML=`<div class="arabic">${esc(w.ar)}</div><div class="muted">${esc(w.tr)}</div><div class="translation">${esc(w.uz)}</div>`;app.querySelector('.btn.secondary').textContent='Tarjima ko‘rsatildi'}
function rateWord(ok){let w=current;w.seen++;if(ok){w.level=Math.min(5,w.level+1);w.next=Date.now()+[0,1,3,7,14,30][w.level]*86400000;meta.learned++;}else{w.level=Math.max(0,w.level-1);w.next=Date.now()+60000}if(meta.lastDay!==today()){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);meta.streak=meta.lastDay===y?(meta.streak||0)+1:1;meta.lastDay=today()}save();current=null;learn()}
function games(){app.innerHTML=`<h2>Mini o‘yinlar</h2><div class="card"><h3>🎯 To‘g‘ri tarjimani tanlang</h3><p class="muted">Arabcha so‘z uchun to‘g‘ri o‘zbekcha ma’noni toping.</p><button class="btn" onclick="startQuiz()">Boshlash</button></div><div class="card"><h3>🧩 Juftliklarni topish</h3><p class="muted">Ikki ustundagi so‘zlarni moslang.</p><button class="btn secondary" onclick="startMatch()">Boshlash</button></div><div class="card"><h3>🏆 Natijalar</h3><p>To‘g‘ri javoblar: <b>${meta.correct||0}</b></p><p>Eng yaxshi natija: <b>${meta.best||0}</b></p></div>`}
function startQuiz(){if(words.length<4){alert('Test uchun kamida 4 ta so‘z qo‘shing.');return}quiz=[...words].sort(()=>Math.random()-.5).slice(0,10);quizIndex=0;score=0;showQuiz()}
function showQuiz(){let w=quiz[quizIndex],opts=[w,...words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);app.innerHTML=`<h2>Tarjimani tanlang</h2><div class="card"><div class="progressrow"><span>${quizIndex+1} / ${quiz.length}</span><span>⭐ ${score}</span></div><div class="bigword"><div class="arabic">${esc(w.ar)}</div></div>${opts.map(o=>`<button class="answer" onclick="answerQuiz(${o.id},${w.id},this)">${esc(o.uz)}</button>`).join('')}<p id="feedback" class="muted"></p></div>`}
function answerQuiz(id,right,el){if(document.querySelector('.answer:disabled'))return;let correct=id===right;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true});el.classList.add(correct?'good':'bad');if(correct){score++;meta.correct=(meta.correct||0)+1}else{let idx=quiz.findIndex(x=>x.id===right);document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===quiz[quizIndex].uz)b.classList.add('good')})}$('#feedback').textContent=correct?'To‘g‘ri!':'To‘g‘ri javob: '+quiz[quizIndex].uz;let next=document.createElement('button');next.className='btn';next.style.width='100%';next.textContent=quizIndex===quiz.length-1?'Natijani ko‘rish':'Keyingi';next.onclick=()=>{quizIndex++;if(quizIndex>=quiz.length){meta.best=Math.max(meta.best||0,score);save();app.innerHTML=`<div class="card bigword"><h2>O‘yin tugadi!</h2><div class="translation">${score} / ${quiz.length}</div><p>To‘g‘ri javoblar</p><button class="btn" onclick="games()">O‘yinlarga qaytish</button></div>`}else showQuiz()};$('.card').append(next);save()}
function startMatch(){if(words.length<4){alert('Juftlik o‘yini uchun kamida 4 ta so‘z qo‘shing.');return}let arr=[...words].sort(()=>Math.random()-.5).slice(0,4);let left=[...arr].sort(()=>Math.random()-.5),right=[...arr].sort(()=>Math.random()-.5);let chosen=null,done=[];app.innerHTML=`<h2>Juftliklarni toping</h2><div class="card"><p class="muted">Avval arabcha, keyin mos tarjimani tanlang.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${left.map(w=>`<button class="answer arabic" data-id="${w.id}" onclick="pickMatch(${w.id},'l',this)">${esc(w.ar)}</button>`).join('')}</div><div>${right.map(w=>`<button class="answer" data-id="${w.id}" onclick="pickMatch(${w.id},'r',this)">${esc(w.uz)}</button>`).join('')}</div></div><p id="matchstatus" class="muted">Topilgan: 0 / 4</p><button class="btn secondary" onclick="games()">Chiqish</button></div>`;window.matchState={chosen,done,left,right}}
function pickMatch(id,side,el){let s=window.matchState;if(el.disabled)return;if(side==='l'){document.querySelectorAll('[data-id]').forEach(b=>{if(b.parentElement===el.parentElement)b.style.outline='none'});s.chosen=id;el.style.outline='2px solid var(--accent)';return}if(s.chosen==null){$('#matchstatus').textContent='Avval arabcha so‘zni tanlang.';return}if(id===s.chosen){s.done.push(id);document.querySelectorAll('[data-id="'+id+'"]').forEach(b=>{b.disabled=true;b.classList.add('good')});$('#matchstatus').textContent='Topildi: '+s.done.length+' / 4';s.chosen=null;if(s.done.length===4){meta.best=Math.max(meta.best||0,4);save();$('#matchstatus').textContent='Ajoyib! Barcha juftliklar topildi.'}}else{$('#matchstatus').textContent='Bu juftlik mos emas. Yana urinib ko‘ring.';s.chosen=null}}

function openOCR(){
 app.innerHTML=`<h2>📷 Rasmdan arabcha matn</h2>
 <div class="card">
 <p class="muted" style="margin-top:0">Galereyadan rasm tanlang. OCR arabcha matnni aniqlashga urinadi. Harakatlar aniqlanmasligi mumkin — natijani tekshiring va kerak bo‘lsa qo‘lda tuzating.</p>
 <div class="field"><label>Rasm tanlash</label><input id="ocrfile" type="file" accept="image/*"></div>
 <img id="ocrpreview" class="hidden" style="width:100%;border-radius:12px;max-height:260px;object-fit:contain;background:var(--bg)">
 <div class="btnrow" style="margin-top:12px"><button class="btn" onclick="runOCR()">Matnni tanish</button><button class="btn secondary" onclick="switchTab('home')">Orqaga</button></div>
 <p id="ocrstatus" class="muted" style="font-size:12px"></p>
 <div class="field"><label>Aniqlangan matn — tahrirlash mumkin</label><textarea id="ocrtext" class="arabic" dir="rtl" placeholder="هنا يظهر النص العربي..."></textarea></div>
 <button class="btn secondary" style="width:100%" onclick="makeOCRWords()">So‘zlarni ajratish</button>
 </div><div id="ocrwords"></div>`;
 $('#ocrfile').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f);$('#ocrpreview').src=u;$('#ocrpreview').classList.remove('hidden')}};
}
async function runOCR(){
 let file=$('#ocrfile')?.files?.[0];if(!file){alert('Avval rasm tanlang.');return}
 let status=$('#ocrstatus');status.textContent='OCR kutubxonasi yuklanmoqda. Internet kerak bo‘lishi mumkin...';
 try{
  if(!window.Tesseract){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('OCR kutubxonasi yuklanmadi'));document.head.appendChild(s)})}
  status.textContent='Arabcha matn tanilmoqda... Bu biroz vaqt olishi mumkin.';
  const worker=await Tesseract.createWorker('ara',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='Matn tanilmoqda: '+Math.round((m.progress||0)*100)+'%'}});
  const result=await worker.recognize(file);await worker.terminate();
  $('#ocrtext').value=(result.data.text||'').trim();
  status.textContent=$('#ocrtext').value?'Tayyor. Natijani tekshiring — OCR xato qilishi mumkin.':'Matn aniqlanmadi. Aniqroq rasmni sinab ko‘ring.';
 }catch(e){status.textContent='Xatolik: '+e.message+'. Internetga ulaning va qayta urinib ko‘ring.'}
}
function makeOCRWords(){
 let text=$('#ocrtext')?.value||'',tokens=[...new Set(text.replace(/[،؛؟.,:;!؟()\[\]{}ـ]/g,' ').split(/\s+/).map(x=>x.trim()).filter(x=>/[\u0600-\u06FF]/.test(x)&&x.length>1))];
 if(!tokens.length){alert('Arabcha so‘z topilmadi.');return}
 $('#ocrwords').innerHTML=`<div class="card"><h3>So‘zlarni tekshiring va tarjima kiriting</h3><p class="muted">OCR matnidan ajratilgan so‘zlar. Harakatlarni va tarjimalarni o‘zingiz tekshiring.</p>${tokens.map((w,i)=>`<div class="field" style="border-bottom:1px solid var(--line);padding-bottom:10px"><label><input type="checkbox" id="ocrcheck${i}" checked style="width:auto;margin-right:7px">Lug‘atga qo‘shish</label><input id="ocra${i}" class="arabic" dir="rtl" value="${esc(w)}"><input id="ocru${i}" placeholder="O‘zbekcha tarjima" style="margin-top:6px"></div>`).join('')}<button class="btn" style="width:100%" onclick="saveOCRWords(${tokens.length})">Tanlangan so‘zlarni saqlash</button></div>`;
}
function saveOCRWords(n){
 let added=0;for(let i=0;i<n;i++){if(!$('#ocrcheck'+i).checked)continue;let ar=$('#ocra'+i).value.trim(),uz=$('#ocru'+i).value.trim();if(!ar||!uz)continue;if(words.some(w=>w.ar===ar))continue;words.unshift({id:Date.now()+i,ar,uz,tr:'',ex:'',cat:'Ta’lim',level:0,fav:false,added:Date.now(),next:0,seen:0});added++}
 save();alert(added+' ta so‘z lug‘atga qo‘shildi. Tarjimasiz yoki takroriy so‘zlar qo‘shilmadi.');switchTab('dict');
}
function exportWords(){
 let blob=new Blob([JSON.stringify({words,meta,exported:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kalima-backup.json';a.click();URL.revokeObjectURL(url);
}

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
